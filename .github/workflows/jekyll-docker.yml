name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # GitHub's official Pages builder; its image is hosted on ghcr.io, so it
    # isn't subject to Docker Hub's unauthenticated pull rate limit.
    - name: Build the site with GitHub Pages' Jekyll builder
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site
        future: true
